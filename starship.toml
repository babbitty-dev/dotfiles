add_newline = true
command_timeout = 500

format = """
$directory$git_branch$git_status$nodejs$cmd_duration
$character"""

[directory]
truncation_length = 3
truncate_to_repo = true

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'

[cmd_duration]
min_time = 2000

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
